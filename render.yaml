services:
  - type: web
    name: weighingqr-backend
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5001
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRE
        value: 7d
      - key: JWT_EXPIRE_LONG
        value: 30d
      - key: ALLOWED_ORIGINS
        sync: false
      - key: SERVER_IP
        sync: false
